[package]
name = "vox"
version = "0.1.0"
edition = "2021"
description = "Offline expressive neural TTS harness: personas, moods, inline mood changes, multi-format export"
license = "MIT"
repository = "https://github.com/Zertrox123/vox-tts"
keywords = ["tts", "text-to-speech", "speech-synthesis", "voice", "onnx"]
categories = ["multimedia::audio", "command-line-utilities"]

[[bin]]
name = "vox"
path = "src/main.rs"

[features]
default = ["ort-download"]
# Download a prebuilt static ONNX Runtime for the target at build time (macOS, Linux, Windows).
# For offline builds: --no-default-features and ORT_LIB_LOCATION=/path/to/onnxruntime
ort-download = ["ort/download-binaries"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
libloading = "0.8"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std"] }
hound = "3.5"
flacenc = "0.5"
mp3lame-encoder = "0.3"
vorbis_rs = "0.5"
ogg = "0.9"
unicode-normalization = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 2
